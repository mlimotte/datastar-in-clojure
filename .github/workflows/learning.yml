# Tests everything and deploys the site to GitHub Pages (Settings → Pages → Source: GitHub Actions).
# All the machinery lives in learning-kit; this project holds only content.
#
# A copy of learning-kit's reusable workflow (.github/workflows/learning.yml) without the
# setup-go step: that step requires go/go.mod, and this project is Clojure-only. Go back to
# `uses: dpsutton/learning-kit/.github/workflows/learning.yml@main` once the kit skips Go for
# projects without it.
name: Learning
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with: { repository: dpsutton/learning-kit, ref: main, path: .kit }
      - uses: actions/setup-java@v6.0.1
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with: { cli: 1.12.1.1561 }
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ hashFiles('clojure/deps.edn') }}
      - uses: actions/setup-node@v7.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: .kit/check-site/package-lock.json }
      - uses: astral-sh/setup-uv@v10.2.0
      - name: lk ci
        run: .kit/bin/lk ci
      - if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6.0.0
      - if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with: { path: _site }

  deploy:
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
